# 首次启动时用于创建 config.yaml；升级启动时按当前模板重建，保留同名配置项的已有值
# 热更新：保存后自动应用；重启生效：保存后需重启网站服务

# 服务：重启生效
server:
  # 网站和 API 的监听地址，默认对外提供 9191 端口；start.sh 使用独立开发配置
  listen: "0.0.0.0:9191"
  # CORS 白名单；同源部署留空，跨源部署填写完整 Origin，如 https://video.example.com
  allowed_origins: []

# 存储：重启生效
storage:
  # 总数据目录，包含媒体、爬虫脚本、日志、备份、临时文件及默认情况下的数据库
  data_dir: "./data"
  # 可选数据库目录；留空时跟随 data_dir
  db_dir: ""

# 日志：重启生效
logging:
  # 是否将运行日志写入文件
  file_enabled: true
  # 单文件上限和总量上限（MiB）；超限后轮转或清理最旧日志
  max_file_size_mb: 5
  max_total_size_mb: 30

# 扫描：重启生效；定时扫描由 nightly 调度，递归不限深度
scanner:
  # 扫描的文件扩展名
  video_extensions: [".mp4", ".mkv", ".mov", ".webm", ".avi", ".strm"]

# 定时任务：热更新，影响后续调度，不中断正在执行的任务
nightly:
  # 停用自动调度；手动执行不受影响
  disabled: false
  # 每日启动时间（HH:mm）和任务时区（IANA 名称）
  start_time: "01:00"
  timezone: "Asia/Shanghai"

# 媒体生成：热更新；各类并发数独立，所有来源共享，范围 1–5
generation:
  thumbnail_concurrency: 1
  preview_concurrency: 1
  fingerprint_concurrency: 1

# 预览：enabled 热更新，其余字段重启后用于后续生成
preview:
  # 控制预览生成和卡片预览；封面不受影响
  enabled: true
  # 已安装的 ffmpeg / ffprobe 命令名或绝对路径
  ffmpeg_path: "ffmpeg"
  ffprobe_path: "ffprobe"
  # 单个 ffmpeg 进程的线程数，范围 1–16
  ffmpeg_threads: 1
  # 预览宽度（像素）；已有预览不会自动重新生成。
  width: 480

# 视频中转：重启生效
proxy:
  # 允许播放器强制请求服务端中转；关闭后，支持直链的网盘仍使用跳转
  allow_forced_relay: true

# 下载：重启生效
remote_upload:
  # 直链和 Telegram 导入保留的磁盘空间（字节），默认 1 GiB
  disk_reserve_bytes: 1073741824
  # 直链下载正文连续无数据的超时时间（秒）
  idle_timeout_seconds: 120

# Telegram：热更新
telegram:
  # 启用需填写 Bot Token；关闭只停止本站接收和导入，不控制 Bot API 进程
  enabled: false
  # BotFather 提供的机器人 Token
  bot_token: ""
  # 允许发送视频的用户 ID；留空时仅响应 /id 等引导消息
  allowed_user_ids: []
  # 选填，用于生成机器人回复中的视频链接
  site_base_url: ""
  # 单文件上限（字节）；消息未提供有效大小或已超限时，拒绝下载
  max_file_size_bytes: 4294967296
  # 待处理任务上限、文件获取超时（秒）
  max_pending_jobs: 100
  fetch_timeout_seconds: 1800
  # 后续转存任务使用的网盘和相对目录；网盘留空时仅保存到本地
  # 转存沿用 nightly 调度，保存不会立即执行转存
  upload_drive_id: ""
  upload_directory: "Telegram"
  # 仅用于 TG 网盘转存，支持 HTTP、HTTPS、SOCKS5、SOCKS5H
  upload_proxy: ""
