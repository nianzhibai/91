<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/app-icon-512-v4.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="91" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="91 — Your Private Video Site" />
    <title>91</title>
    <!--
      在 React 挂载前，从 localStorage 同步上次保存的主题，立刻设到 <html data-theme>，
      避免深浅主题闪烁。真实的服务端值会在 main.tsx 启动时异步对齐。
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("video-site:theme");
          // 旧的浅色主题统一迁移为亮色。
          if (t === "pink" || t === "sky") t = "light";
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          } else {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
