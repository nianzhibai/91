name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Serialize releases across tags; never cancel a publisher or discard pending tags.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/release.mjs metadata

  checks:
    needs: preflight
    uses: ./.github/workflows/checks.yml
    with:
      force-all: true

  frontend:
    needs: checks
    uses: ./.github/workflows/prepare-frontend.yml

  images:
    needs: [preflight, checks, frontend]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      push: true
      version: ${{ needs.preflight.outputs.version }}
      frontend-artifact: ${{ needs.frontend.outputs.artifact }}

  packages:
    name: Build Linux packages
    needs: [preflight, checks, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Download verified frontend archive
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.frontend.outputs.artifact }}
          path: frontend-bundle
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build release packages
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          scripts/build-release.sh 2>&1 | tee "$RUNNER_TEMP/package-build.log"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-packages
          archive: true
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-build-failure-logs
          path: ${{ runner.temp }}/package-build.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish release and image channels
    needs: [preflight, checks, images, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-packages
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: docker-digests-*
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified assets and promote channels
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ runner.temp }}/release
          DIGEST_DIR: ${{ runner.temp }}/digests
          IMAGE: ${{ needs.images.outputs.image }}
        run: node .github/scripts/release.mjs publish 2>&1 | tee "$RUNNER_TEMP/release-publish.log"
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-publish-failure-logs
          path: ${{ runner.temp }}/release-publish.log
          if-no-files-found: ignore
          retention-days: 14
