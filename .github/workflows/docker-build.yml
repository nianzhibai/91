name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede branch and PR builds, but let version-tag releases finish.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          npm ci

      - name: Check frontend dependencies and source
        run: npm run check

      - name: Determine image name
        id: image
        shell: bash
        run: echo "name=$REGISTRY/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Determine image version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --short=12 HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build Docker (${{ matrix.id }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: amd64
            arch: amd64
            target: runtime
            runner: ubuntu-24.04
          - id: arm64
            arch: arm64
            target: runtime
            runner: ubuntu-24.04-arm
          - id: rockchip-arm64
            arch: arm64
            target: rockchip
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ needs.prepare.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          # Only the publish job updates shared tags after all builds succeed.
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=91-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=91-${{ matrix.id }}

      - name: Export image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/digest.txt"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-digests-${{ matrix.id }}
          archive: true
          path: ${{ runner.temp }}/digests/digest.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Publish multi-platform Docker image
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digests-*
          merge-multiple: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and publish image manifests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        shell: bash
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "$RUNNER_TEMP/digests/docker-digests-$arch/digest.txt")
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Invalid image digest for $arch" >&2
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done
          rockchip_digest=$(cat "$RUNNER_TEMP/digests/docker-digests-rockchip-arm64/digest.txt")
          if [[ ! "$rockchip_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest for rockchip-arm64" >&2
            exit 1
          fi
          tags=()
          rockchip_tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tags+=(--tag "$tag")
              rockchip_tags+=(--tag "${tag}-rockchip")
            fi
          done <<< "$TAGS"
          if (( ${#tags[@]} == 0 )); then
            echo "No image tags to publish" >&2
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools create "${rockchip_tags[@]}" "$IMAGE@$rockchip_digest"
