name: Build Docker images

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        required: true
      version:
        type: string
        default: ""
      frontend-artifact:
        description: Verified frontend archive from the preparation job
        type: string
        required: true
    outputs:
      image:
        description: Registry image name
        value: ${{ jobs.prepare.outputs.image }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Determine image metadata
        id: metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="$RELEASE_VERSION"
          if [[ -z "$version" ]]; then
            version="$(git describe --tags --always)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build Docker (${{ matrix.id }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: amd64
            arch: amd64
            target: runtime
            runner: ubuntu-24.04
          - id: arm64
            arch: arm64
            target: runtime
            runner: ubuntu-24.04-arm
          - id: rockchip-arm64
            arch: arm64
            target: rockchip
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download verified frontend archive
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.frontend-artifact }}
          path: frontend-bundle

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          # Only the publish job updates shared tags after all builds succeed.
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          cache-from: type=gha,scope=91-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=91-${{ matrix.id }}

      - name: Export image digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/digest.txt"

      - name: Upload image digest
        if: inputs.push
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-digests-${{ matrix.id }}
          archive: true
          path: ${{ runner.temp }}/digests/digest.txt
          if-no-files-found: error
          retention-days: 30
          overwrite: true
