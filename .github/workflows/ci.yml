name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Superseded pull request runs are disposable. Runs on main may be publishing
# image tags, so they finish and newer pushes wait.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Detect affected checks
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-changes.mjs

  checks:
    needs: changes
    uses: ./.github/workflows/checks.yml
    with:
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      backend: ${{ needs.changes.outputs.backend == 'true' }}

  # Images build alongside the checks; only publish waits for both.
  frontend:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    uses: ./.github/workflows/prepare-frontend.yml

  images:
    needs: [changes, frontend]
    if: needs.changes.outputs.images == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      frontend-artifact: ${{ needs.frontend.outputs.artifact }}

  check:
    name: Check
    if: always()
    needs: [changes, checks, frontend, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require checks and affected image builds
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e '
            .changes.result == "success" and .checks.result == "success" and
            ((.frontend.result == "success" and .images.result == "success") or
              (.frontend.result == "skipped" and .images.result == "skipped" and
                .changes.outputs.images == "false"))' > /dev/null

  publish:
    name: Publish main images
    needs: [checks, images]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digests-*
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge and publish image manifests
        env:
          IMAGE: ${{ needs.images.outputs.image }}
          DIGEST_DIR: ${{ runner.temp }}/digests
          TAGS: |
            ${{ needs.images.outputs.image }}:main
            ${{ needs.images.outputs.image }}:sha-${{ github.sha }}
        run: bash .github/scripts/publish-images.sh 2>&1 | tee "$RUNNER_TEMP/image-publish.log"
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image-publish-failure-logs
          path: ${{ runner.temp }}/image-publish.log
          if-no-files-found: ignore
          retention-days: 14
