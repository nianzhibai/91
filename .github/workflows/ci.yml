name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  images:
    needs: checks
    if: needs.checks.outputs.images == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  check:
    name: Check
    if: always()
    needs: [checks, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require checks and affected image builds
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e '
            .checks.result == "success" and
            (.images.result == "success" or
              (.images.result == "skipped" and .checks.outputs.images == "false"))' > /dev/null

  publish:
    name: Publish main images
    needs: [checks, images]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digests-*
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge and publish image manifests
        env:
          IMAGE: ${{ needs.images.outputs.image }}
          DIGEST_DIR: ${{ runner.temp }}/digests
          TAGS: |
            ${{ needs.images.outputs.image }}:main
            ${{ needs.images.outputs.image }}:sha-${{ github.sha }}
        run: bash .github/scripts/publish-images.sh 2>&1 | tee "$RUNNER_TEMP/image-publish.log"
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image-publish-failure-logs
          path: ${{ runner.temp }}/image-publish.log
          if-no-files-found: ignore
          retention-days: 14
