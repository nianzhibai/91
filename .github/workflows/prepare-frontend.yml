name: Prepare frontend

on:
  workflow_call:
    outputs:
      artifact:
        description: Verified frontend archives for image and package builds
        value: ${{ jobs.prepare.outputs.artifact }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact: frontend-bundle
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download pinned frontend archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -c '.frontends[]' frontend.lock.json | while read -r pinned; do
            repository=$(jq -er '.repository' <<<"$pinned")
            name=$(jq -er '.name' <<<"$pinned")
            version=$(jq -er '.version' <<<"$pinned")
            gh release download "$version" --repo "${repository#https://github.com/}" \
              --pattern frontend.tar.gz --output "frontend-bundle/$name.tar.gz"
          done
      - name: Verify frontend packages
        env:
          FRONTEND_ARCHIVES: ${{ github.workspace }}/frontend-bundle
        shell: bash
        run: bash scripts/prepare-frontend.sh "$RUNNER_TEMP/verified-frontend"
      - name: Share verified frontend archives
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-bundle
          archive: true
          path: frontend-bundle/*.tar.gz
          if-no-files-found: error
          retention-days: 30
          overwrite: true
